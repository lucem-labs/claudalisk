name: ci

on:
  push:
    branches-ignore: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  adrs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
      - name: ADR index check
        run: node tools/check-adrs.mjs
      - name: Tool dependencies
        run: npm ci --prefix tools --ignore-scripts --no-audit --no-fund
      - name: Tool tests
        run: node --test tools/*.test.mjs templates/app/scripts/*.test.mjs hooks/*.test.mjs 'packages/scripts/**/*.test.mjs' spikes/lsp-host/edits.test.mjs spikes/lsp-host/solution.test.mjs spikes/lsp-host/memory.test.mjs spikes/lsp-host/rpc.test.mjs spikes/lsp-host/no-docker.test.mjs spikes/lsp-host/render.test.mjs spikes/lsp-host/session.test.mjs spikes/lsp-host/fixture.test.mjs spikes/lsp-setups/client-emulation.test.mjs spikes/lsp-setups/hook.test.mjs spikes/lsp-setups/render.test.mjs
      - name: No comments
        run: node tools/no-comments.mjs
      - name: Source hygiene
        run: node tools/check-source-hygiene.mjs

  template-workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
      - name: Install zizmor
        run: node tools/install-security-tools.mjs --tool zizmor
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Template workflows (zizmor)
        run: zizmor --config templates/app/.github/zizmor.yml templates/app/.github/workflows
        env:
          GH_TOKEN: ${{ github.token }}

  registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - name: Plugin manifest and MCP configuration
        run: npx --yes @anthropic-ai/claude-code@2.1.299 plugin validate .
      - name: Registry build, install and tests
        run: node tools/check-registry.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}

  backend-scaffold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
      - name: Generate a backend with no modules
        run: node tools/scaffold.mjs backend "$RUNNER_TEMP/app" --root Acme
      - name: Test the backend with no modules
        working-directory: ${{ runner.temp }}/app
        run: dotnet test --solution backend/Acme.slnx
      - name: Add the first module
        run: node tools/scaffold.mjs add-module "$RUNNER_TEMP/app" --module Ordering --aggregate Order
      - name: Add a second module
        run: node tools/scaffold.mjs add-module "$RUNNER_TEMP/app" --module OrderHistory --aggregate HistoryEntry --plural HistoryEntries
      - name: Test the backend with modules
        working-directory: ${{ runner.temp }}/app
        run: dotnet test --solution backend/Acme.slnx

  new-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - name: Tool dependencies
        run: npm ci --prefix tools --ignore-scripts --no-audit --no-fund
      - name: Generate an app and run its checks
        run: node tools/check-new-app.mjs

  unit-of-work-spike:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73
        with:
          dotnet-version: 10.0.x
      - name: Unit-of-work spike tests
        run: dotnet test spikes/unit-of-work/UnitOfWorkSpike.slnx

  lsp-host-spike:
    name: lsp-host-spike (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            result: linux
          - os: windows-latest
            result: windows
          - os: macos-latest
            result: macos
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - name: Keep the generated app between steps
        shell: bash
        run: echo "LSP_HOST_WORK=$RUNNER_TEMP/lsp-host-work" >> "$GITHUB_ENV"
      - name: Tool dependencies
        run: npm ci --prefix tools --ignore-scripts --no-audit --no-fund
      - name: Spike dependencies
        run: npm ci --prefix spikes/lsp-host --ignore-scripts --no-audit --no-fund
      - name: Restore the pinned language servers
        working-directory: spikes/lsp-host
        run: dotnet tool restore
      - name: Tests, the capability probe first
        working-directory: spikes/lsp-host
        run: node --test --test-concurrency=1 *.test.mjs
        timeout-minutes: 60
      - name: Measure
        working-directory: spikes/lsp-host
        run: node measure.mjs
        timeout-minutes: 150
      - name: Upload the results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lsp-host-results-${{ matrix.os }}
          path: spikes/lsp-host/results/${{ matrix.result }}.json
          if-no-files-found: ignore

  lsp-setups:
    name: lsp-setups (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            result: linux
          - os: windows-latest
            result: windows
          - os: macos-latest
            result: macos
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - name: Keep the generated app between steps
        shell: bash
        run: echo "LSP_HOST_WORK=$RUNNER_TEMP/lsp-setups-work" >> "$GITHUB_ENV"
      - name: Keep the install log between steps
        shell: bash
        run: echo "LSP_SETUPS_INSTALL_LOG=$RUNNER_TEMP/lsp-setups-install.json" >> "$GITHUB_ENV"
      - name: Tool dependencies
        run: npm ci --prefix tools --ignore-scripts --no-audit --no-fund
      - name: Install, plugins, csharp-ls
        run: node spikes/lsp-setups/install-step.mjs plugins dotnet tool install --global csharp-ls
      - name: Install, plugins, TypeScript 7
        run: node spikes/lsp-setups/install-step.mjs plugins npm install -g typescript@7
      - name: Install, plugins, yaml-language-server
        run: node spikes/lsp-setups/install-step.mjs plugins npm install -g yaml-language-server
      - name: Install, lspjson, Roslyn language server
        run: node spikes/lsp-setups/install-step.mjs lspjson dotnet tool install --global roslyn-language-server --prerelease
      - name: Install, host, dotnet tool restore
        working-directory: spikes/lsp-setups
        run: node install-step.mjs host dotnet tool restore
      - name: Install, host, npm ci
        working-directory: spikes/lsp-setups
        run: node install-step.mjs host npm ci --ignore-scripts --no-audit --no-fund
      - name: Tests
        working-directory: spikes/lsp-setups
        run: node --test --test-concurrency=1 *.test.mjs
        timeout-minutes: 20
      - name: Measure, Roslyn launches for lspjson
        working-directory: spikes/lsp-setups
        run: node measure.mjs --part attempts
        timeout-minutes: 60
      - name: Measure, diagnostics after an edit
        if: ${{ !cancelled() }}
        working-directory: spikes/lsp-setups
        run: node measure.mjs --part correctness
        timeout-minutes: 120
      - name: Measure, two worktrees
        if: ${{ !cancelled() }}
        working-directory: spikes/lsp-setups
        run: node measure.mjs --part worktrees
        timeout-minutes: 60
      - name: Measure, servers and memory
        if: ${{ !cancelled() }}
        working-directory: spikes/lsp-setups
        run: node measure.mjs --part memory
        timeout-minutes: 90
      - name: Measure, the PostToolUse hook
        if: ${{ !cancelled() }}
        working-directory: spikes/lsp-setups
        run: node measure.mjs --part hook
        timeout-minutes: 60
      - name: Merge the parts
        if: ${{ !cancelled() }}
        working-directory: spikes/lsp-setups
        run: node measure.mjs --part merge
      - name: Upload the results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lsp-setups-results-${{ matrix.os }}
          path: spikes/lsp-setups/results/${{ matrix.result }}.json
          if-no-files-found: ignore

  code-intel-bench:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - name: Code intelligence benchmark harness tests
        run: node --test "spikes/code-intel-bench/*.test.mjs"
