name: ci

on:
  push:
    branches-ignore: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  adrs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: ADR index check
        run: node tools/check-adrs.mjs
      - name: Tool tests
        run: node --test tools/*.test.mjs

  unit-of-work-spike:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Unit-of-work spike tests
        run: dotnet test spikes/unit-of-work/UnitOfWorkSpike.slnx
