name: ci

on:
  push:
    branches-ignore: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  adrs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
      - name: ADR index check
        run: node tools/check-adrs.mjs
      - name: Tool dependencies
        run: npm ci --prefix tools --ignore-scripts --no-audit --no-fund
      - name: Tool tests
        run: node --test tools/*.test.mjs templates/app/scripts/*.test.mjs hooks/*.test.mjs 'packages/scripts/**/*.test.mjs'
      - name: No comments
        run: node tools/no-comments.mjs
      - name: Source hygiene
        run: node tools/check-source-hygiene.mjs

  template-workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
      - name: Install zizmor
        run: node tools/install-security-tools.mjs --tool zizmor
      - name: Template workflows (zizmor)
        run: zizmor --config templates/app/.github/zizmor.yml templates/app/.github/workflows
        env:
          GH_TOKEN: ${{ github.token }}

  registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - name: Plugin manifest and MCP configuration
        run: npx --yes @anthropic-ai/claude-code@2.1.299 plugin validate .
      - name: Registry build, install and tests
        run: node tools/check-registry.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}

  unit-of-work-spike:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73
        with:
          dotnet-version: 10.0.x
      - name: Unit-of-work spike tests
        run: dotnet test spikes/unit-of-work/UnitOfWorkSpike.slnx
